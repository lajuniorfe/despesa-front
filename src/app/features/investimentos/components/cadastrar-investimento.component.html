<div class="overlay">
  <div class="modal-wrapper" (click)="$event.stopPropagation()">
    <p-card class="w-full bg-gray-50">
      <ng-template #title> Cadastro de Investimento </ng-template>

      <form [formGroup]="formulario" class="w-full mt-3">
        <div class="flex gap-2 mb-5">
          <div class="flex flex-column flex-1">
            <label class="w-full text-gray-600" for="username">Valor</label>
            <p-inputnumber
              formControlName="valor"
              mode="currency"
              currency="BRL"
              locale="pt-BR"
              class="w-full"
              placeholder="R$ 00,00"
            ></p-inputnumber>
          </div>
          <div class="flex flex-column flex-1">
            <label class="w-full text-gray-600" for="username">Data</label>
            <p-datepicker
              formControlName="data"
              placeholder="dd/mm/yyyy"
              pInputMask="99/99/9999"
              dateFormat="dd/mm/yy"
            />
          </div>
        </div>

        <div class="flex gap-2 mb-5 w-full">
          <div class="flex flex-column w-6">
            <label class="text-gray-600 w-full">Tipo de investimento</label>
            <p-select
              [options]="grupoTipoInvestimento"
              formControlName="tipoInvestimento"
              optionLabel="label"
              optionValue="value"
              placeholder="Selecione o tipo de investimento"
              class="w-full"
            >
              <ng-template let-item pTemplate="item">
                <div class="flex items-center">
                  <span>{{ item.label }}</span>
                </div>
              </ng-template>
            </p-select>
          </div>
          <div class="flex flex-column w-6">
            <label
              class="block mb-1 text-sm font-medium text-gray-600"
              for="username"
              >Descrição</label
            >
            <input
              formControlName="descricao"
              class="w-full"
              id="descricao"
              pInputText
              autocomplete="off"
            />
          </div>
        </div>

        <div class="flex gap-2 mx-auto w-fit">
          <p-button
            label="Cancelar"
            variant="text"
            severity="danger"
            (onClick)="fecharTela()"
          />
          <p-button
            label="Salvar"
            variant="text"
            icon="pi pi-check"
            (onClick)="cadastrarInvestimento()"
          />
        </div>
      </form>
    </p-card>
  </div>
</div>
<p-toast />
